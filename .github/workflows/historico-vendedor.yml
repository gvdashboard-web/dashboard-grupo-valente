name: Histórico Vendedor (sob demanda)

on:
  workflow_dispatch:
    inputs:
      vendedor:
        description: 'Nome do vendedor (ex: "Erivan Lima")'
        required: true
        default: 'Erivan Lima'
        type: string
      meses:
        description: 'Quantos meses pra tras'
        required: true
        default: '12'
        type: string

# MESMO grupo do update-dashboard: os dois consomem o MESMO refresh_token
# (single-use, rotacionado a cada uso) — rodar em paralelo = invalid_grant.
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  historico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pynacl

      - name: Rodar query
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
          CA_REFRESH_TOKEN: ${{ secrets.CA_REFRESH_TOKEN }}
          # ca_client persiste o refresh_token rotacionado direto no secret —
          # sem isso, rodar este workflow invalidaria o token do update-dashboard.
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          python3 scripts/puxar_historico_vendedor.py \
            "${{ github.event.inputs.vendedor }}" \
            "${{ github.event.inputs.meses }}"
