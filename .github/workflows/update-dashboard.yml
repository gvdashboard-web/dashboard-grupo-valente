name: Atualizar Dashboard Diariamente

on:
  schedule:
    # Schedule do GitHub é unreliable (bem documentado) — mantemos como fallback.
    - cron: '7 0-3,12-14,21-23 * * *'
    - cron: '7,37 15-20 * * *'
  # Trigger externo via cron-job.org (mais confiavel que schedule do GH).
  # Disparado via: POST /repos/.../dispatches com {"event_type":"refresh-dashboard"}
  repository_dispatch:
    types: [refresh-dashboard]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Serializa runs concorrentes pra evitar race condition no refresh_token.
# Conta Azul invalida o token a cada uso — se 2 jobs leem o mesmo refresh_token
# em paralelo, um rotaciona com sucesso e o outro morre com invalid_grant
# (e o secret pode ficar dessincronizado).
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pynacl

      - name: Rodar atualizar_dados.py em modo Conta Azul
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
          CA_REFRESH_TOKEN: ${{ secrets.CA_REFRESH_TOKEN }}
          # ca_client persiste o refresh_token rotacionado direto no secret
          # (inline, no momento da rotacao) — nao depende do step Persistir.
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          python3 scripts/atualizar_dados.py \
            --ca-fetch \
            --target "${GITHUB_WORKSPACE}/index.html"

      - name: Persistir novo refresh_token (se rotacionou)
        # always() é CRITICO: se o script rotacionou o token mas falhou depois
        # numa chamada da API, o secret PRECISA atualizar igual — senao a proxima
        # execucao usa o token velho (ja consumido) e morre em invalid_grant.
        if: always() && env.NEW_REFRESH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          python3 scripts/update_github_secret.py \
            "${{ github.repository }}" \
            CA_REFRESH_TOKEN \
            "$NEW_REFRESH_TOKEN"

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma mudanca — index.html identico ao anterior"
          else
            DATA=$(date '+%Y-%m-%d %H:%M UTC')
            git commit -m "Atualizacao automatica via API Conta Azul — $DATA"
            git push
            echo "Commit feito!"
          fi

      # Alerta visivel quando o dashboard quebra: abre UMA issue (sem spam) e
      # fecha automaticamente quando o workflow volta a passar.
      - name: Abrir issue se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer $GH_TOKEN"
          # ja existe issue aberta de falha?
          N=$(curl -s -H "$AUTH" "$API/issues?state=open&labels=dashboard-down" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d))')
          if [ "$N" = "0" ]; then
            curl -s -X POST -H "$AUTH" "$API/labels" -d '{"name":"dashboard-down","color":"d73a4a"}' > /dev/null || true
            curl -s -X POST -H "$AUTH" "$API/issues" -d "{
              \"title\": \"🔴 Dashboard parou de atualizar\",
              \"labels\": [\"dashboard-down\"],
              \"body\": \"O workflow de atualizacao falhou.\n\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\nCausa mais comum: refresh_token da Conta Azul invalido (invalid_grant) — requer re-autorizacao OAuth.\n\nEsta issue fecha sozinha quando o workflow voltar a passar.\"
            }" > /dev/null
            echo "Issue de falha aberta"
          else
            echo "Issue de falha ja existe — sem spam"
          fi

      - name: Fechar issue de falha se passou
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer $GH_TOKEN"
          curl -s -H "$AUTH" "$API/issues?state=open&labels=dashboard-down" | \
            python3 -c 'import json,sys; [print(i["number"]) for i in json.load(sys.stdin)]' | \
            while read -r NUM; do
              curl -s -X PATCH -H "$AUTH" "$API/issues/$NUM" -d '{"state":"closed"}' > /dev/null
              curl -s -X POST -H "$AUTH" "$API/issues/$NUM/comments" -d '{"body":"✅ Workflow voltou a passar — dashboard atualizando normalmente."}' > /dev/null
              echo "Issue #$NUM fechada"
            done
