name: Atualizar Dashboard Diariamente

on:
  schedule:
    # Schedule do GitHub é unreliable (bem documentado) — mantemos como fallback.
    - cron: '7 0-3,12-14,21-23 * * *'
    - cron: '7,37 15-20 * * *'
  # Trigger externo via cron-job.org (mais confiavel que schedule do GH).
  # Disparado via: POST /repos/.../dispatches com {"event_type":"refresh-dashboard"}
  repository_dispatch:
    types: [refresh-dashboard]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Serializa runs concorrentes pra evitar race condition no refresh_token.
# Conta Azul invalida o token a cada uso — se 2 jobs leem o mesmo refresh_token
# em paralelo, um rotaciona com sucesso e o outro morre com invalid_grant
# (e o secret pode ficar dessincronizado).
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pynacl

      - name: Rodar atualizar_dados.py em modo Conta Azul
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
          CA_REFRESH_TOKEN: ${{ secrets.CA_REFRESH_TOKEN }}
          # ca_client persiste o refresh_token rotacionado direto no secret
          # (inline, no momento da rotacao) — nao depende do step Persistir.
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          python3 scripts/atualizar_dados.py \
            --ca-fetch \
            --target "${GITHUB_WORKSPACE}/index.html"

      - name: Persistir novo refresh_token (se rotacionou)
        # always() é CRITICO: se o script rotacionou o token mas falhou depois
        # numa chamada da API, o secret PRECISA atualizar igual — senao a proxima
        # execucao usa o token velho (ja consumido) e morre em invalid_grant.
        if: always() && env.NEW_REFRESH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          python3 scripts/update_github_secret.py \
            "${{ github.repository }}" \
            CA_REFRESH_TOKEN \
            "$NEW_REFRESH_TOKEN"

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retry: quando o schedule do GH atrasa e colide com o cron-job.org,
          # outro run pode commitar entre nosso checkout e o push (rejeicao
          # non-fast-forward — ~6% dos runs). Realinha preservando NOSSO
          # index.html e tenta de novo; se ficar identico, nada a fazer.
          ok=""
          for i in 1 2 3; do
            git add index.html
            if git diff --cached --quiet; then
              echo "Nenhuma mudanca — index.html identico ao anterior"
              ok=1; break
            fi
            DATA=$(date '+%Y-%m-%d %H:%M UTC')
            git commit -m "Atualizacao automatica via API Conta Azul — $DATA"
            if git push; then
              echo "Commit feito!"
              ok=1; break
            fi
            echo "Push rejeitado (corrida com outro run) — realinhando, tentativa $i"
            cp index.html /tmp/nosso_index.html
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/nosso_index.html index.html
          done
          if [ -z "$ok" ]; then echo "ERRO: push falhou apos 3 tentativas"; exit 1; fi

      # ── Relatorios por produto (1x/semana) ──
      # continue-on-error: se isto falhar, o DASHBOARD acima ja commitou e o job
      # segue verde — nunca derruba o dashboard nem abre alarme falso.
      # Usa o refresh_token recem-rotacionado pelo passo do dashboard (handoff via
      # NEW_REFRESH_TOKEN), com fallback pro secret. So cliente fica fora do repo:
      # o cache em claro NAO e commitado (git add produtos/ explicito).
      - name: Atualizar relatorios por produto (semanal)
        continue-on-error: true
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
          CA_REFRESH_TOKEN: ${{ env.NEW_REFRESH_TOKEN || secrets.CA_REFRESH_TOKEN }}
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
          STATICRYPT_PW: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          # 1x por SEMANA, com RETRY DIARIO: tenta todo dia as 03h UTC ate conseguir
          # uma vez na semana ISO; depois pula ate a semana virar. Disparo manual forca.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if [ "$(date -u +%H)" != "03" ]; then
              echo "Nao e 03h UTC — tentativa diaria so nessa hora. Pulando."
              exit 0
            fi
            CURWEEK=$(date -u +%G-%V)
            LASTWEEK=$(cat produtos/.last_run 2>/dev/null || echo "")
            if [ "$CURWEEK" = "$LASTWEEK" ]; then
              echo "Produtos ja atualizados nesta semana ($CURWEEK) — pulando."
              exit 0
            fi
            echo "Semana $CURWEEK ainda nao atualizada — rodando (retry diario)."
          fi
          echo "1) Backfill de produtos (Conta Azul)..."
          python3 scripts/backfill_produtos.py
          echo "2) Gerando relatorios..."
          python3 scripts/gerar_relatorio_produto.py
          echo "3) Cifrando (staticrypt)..."
          npx --yes staticrypt relatorios-produtos/*.html \
            -p "$STATICRYPT_PW" --short --salt 804c0459cc58b89521e62eed1ed3e36b \
            --remember=30 -d produtos_enc -t scripts/staticrypt_template.html \
            --template-title "Relatorios · Grupo Valente" \
            --template-instructions "Acesso restrito. Digite a senha para ver os relatorios." \
            --template-button "Entrar"
          mkdir -p produtos && cp produtos_enc/*.html produtos/
          date -u +%G-%V > produtos/.last_run   # marca a semana ISO como feita (trava o retry diario)
          echo "4) Commit (so os produtos cifrados; cache de cliente NUNCA entra)..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ok=""
          for i in 1 2 3; do
            git add produtos/
            if git diff --cached --quiet; then echo "produtos sem mudanca"; ok=1; break; fi
            git commit -m "Relatorios por produto — $(date '+%Y-%m-%d %H:%M UTC')"
            if git push; then echo "produtos publicados"; ok=1; break; fi
            echo "push rejeitado (corrida) — realinhando, tentativa $i"
            rm -rf /tmp/produtos_bak && cp -r produtos /tmp/produtos_bak
            git fetch origin main && git reset --hard origin/main
            rm -rf produtos && cp -r /tmp/produtos_bak produtos
          done
          if [ -z "$ok" ]; then echo "AVISO: push dos produtos falhou (dashboard nao afetado)"; fi

      # Alerta visivel quando o dashboard quebra: abre UMA issue (sem spam) e
      # fecha automaticamente quando o workflow volta a passar.
      - name: Abrir issue se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer $GH_TOKEN"
          # ja existe issue aberta de falha?
          N=$(curl -s -H "$AUTH" "$API/issues?state=open&labels=dashboard-down" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d))')
          if [ "$N" = "0" ]; then
            curl -s -X POST -H "$AUTH" "$API/labels" -d '{"name":"dashboard-down","color":"d73a4a"}' > /dev/null || true
            curl -s -X POST -H "$AUTH" "$API/issues" -d "{
              \"title\": \"🔴 Dashboard parou de atualizar\",
              \"labels\": [\"dashboard-down\"],
              \"body\": \"O workflow de atualizacao falhou.\n\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\nCausa mais comum: refresh_token da Conta Azul invalido (invalid_grant) — requer re-autorizacao OAuth.\n\nEsta issue fecha sozinha quando o workflow voltar a passar.\"
            }" > /dev/null
            echo "Issue de falha aberta"
          else
            echo "Issue de falha ja existe — sem spam"
          fi

      - name: Fechar issue de falha se passou
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer $GH_TOKEN"
          curl -s -H "$AUTH" "$API/issues?state=open&labels=dashboard-down" | \
            python3 -c 'import json,sys; [print(i["number"]) for i in json.load(sys.stdin)]' | \
            while read -r NUM; do
              curl -s -X PATCH -H "$AUTH" "$API/issues/$NUM" -d '{"state":"closed"}' > /dev/null
              curl -s -X POST -H "$AUTH" "$API/issues/$NUM/comments" -d '{"body":"✅ Workflow voltou a passar — dashboard atualizando normalmente."}' > /dev/null
              echo "Issue #$NUM fechada"
            done
