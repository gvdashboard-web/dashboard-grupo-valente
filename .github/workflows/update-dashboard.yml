name: Atualizar Dashboard Diariamente

on:
  schedule:
    # Schedule do GitHub é unreliable (bem documentado) — mantemos como fallback.
    - cron: '7 0-3,12-14,21-23 * * *'
    - cron: '7,37 15-20 * * *'
  # Trigger externo via cron-job.org (mais confiavel que schedule do GH).
  # Disparado via: POST /repos/.../dispatches com {"event_type":"refresh-dashboard"}
  repository_dispatch:
    types: [refresh-dashboard]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pynacl

      - name: Rodar atualizar_dados.py em modo Conta Azul
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
          CA_REFRESH_TOKEN: ${{ secrets.CA_REFRESH_TOKEN }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          python3 scripts/atualizar_dados.py \
            --ca-fetch \
            --target "${GITHUB_WORKSPACE}/index.html"

      - name: Persistir novo refresh_token (se rotacionou)
        if: env.NEW_REFRESH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          python3 scripts/update_github_secret.py \
            "${{ github.repository }}" \
            CA_REFRESH_TOKEN \
            "$NEW_REFRESH_TOKEN"

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma mudanca — index.html identico ao anterior"
          else
            DATA=$(date '+%Y-%m-%d %H:%M UTC')
            git commit -m "Atualizacao automatica via API Conta Azul — $DATA"
            git push
            echo "Commit feito!"
          fi
