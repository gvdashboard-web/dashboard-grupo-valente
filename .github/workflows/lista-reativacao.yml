name: Lista de Reativação (sob demanda)

on:
  workflow_dispatch:
    inputs:
      vendedor:
        description: 'Nome do vendedor (ex: "Róger Silva")'
        required: true
        default: 'Róger Silva'
        type: string
      meses:
        description: 'Janela de histórico (meses)'
        required: true
        default: '12'
        type: string
      dias_min:
        description: 'Mínimo de dias sem comprar'
        required: true
        default: '45'
        type: string

# MESMO grupo dos outros workflows: todos consomem o MESMO refresh_token
# (single-use, rotacionado a cada uso) — rodar em paralelo = invalid_grant.
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  lista:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pynacl

      - name: Gerar lista
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
          CA_REFRESH_TOKEN: ${{ secrets.CA_REFRESH_TOKEN }}
          # ca_client persiste o refresh_token rotacionado direto no secret
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          python3 scripts/lista_reativacao.py \
            "${{ github.event.inputs.vendedor }}" \
            "${{ github.event.inputs.meses }}" \
            "${{ github.event.inputs.dias_min }}"
